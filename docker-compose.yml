# The self-hosted stack, driven by install-debian.sh (which also
# generates the .env this file needs).
name: firmabok
services:
  proxy:
    image: nginx:stable-alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.selfhost.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    mem_limit: 128m
    pids_limit: 50
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: ghcr.io/mews-se/firmabok:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      proxy:
        condition: service_started
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://${DOMAIN:?set DOMAIN in .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?generated into .env by install-debian.sh}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?generated into .env by install-debian.sh}
      NEXT_PUBLIC_APP_URL: http://${DOMAIN}
      CRON_SECRET: ${CRON_SECRET:?generated into .env by install-debian.sh}
      NEXT_PUBLIC_BRANDING_APP_NAME: Firmabok
      NEXT_PUBLIC_SELF_HOSTED: "true"
      AUTH_SIGNUPS_DISABLED: ${AUTH_SIGNUPS_DISABLED}
      STORAGE_DIR: /var/lib/firmabok-storage
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - storage_data:/var/lib/firmabok-storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    tmpfs:
      - /tmp
      - /app/.next:uid=1001,gid=1001,mode=750,size=400m
      - /app/public:uid=1001,gid=1001,mode=750,size=200m
    mem_limit: 1g
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  cron:
    build:
      context: docker
      dockerfile: cron.Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_URL=http://app:3000
    volumes:
      - ./docker/crontab.self-hosted:/etc/supercronic/crontab:ro
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    pids_limit: 30
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18.2-alpine
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated into .env by install-debian.sh}
      POSTGRES_DB: postgres
      # icu because musl locales cannot sort å/ä/ö
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=sv-SE --locale=C.UTF-8
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - track_activity_query_size=1024
      - -c
      - max_wal_size=512MB
      - -c
      - jit=off
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  migrate:
    image: postgres:18.2-alpine
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    logging: *logging

  auth:
    image: supabase/gotrue:v2.189.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 60s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://${DOMAIN}/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: http://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: http://${DOMAIN}/auth/callback,http://${DOMAIN}/api/auth/callback
      GOTRUE_DISABLE_SIGNUP: ${AUTH_SIGNUPS_DISABLED}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?generated into .env by install-debian.sh}
      # The app pins user-token issuers to <public url>/auth/v1.
      GOTRUE_JWT_ISSUER: http://${DOMAIN}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Firmabok
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    restart: unless-stopped
    logging: *logging

  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_POOL: "5"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]
    restart: unless-stopped
    logging: *logging

volumes:
  db_data:
  storage_data:
