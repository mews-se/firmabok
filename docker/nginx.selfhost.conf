# Single entry point for the self-hosted stack: the app and the Supabase
# services share one origin, so there is no CORS and no TLS machinery.
# Plain HTTP by design - the stack is built for a private LAN, and the
# app's cookies follow the URL scheme (see lib/auth/cookie-secure.ts).
# Path prefixes mirror the hosted Supabase gateway layout; a trailing
# slash on proxy_pass strips the matched prefix.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Document uploads through the app go up to 50 MB.
    client_max_body_size 60m;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js streams responses; do not buffer them.
        proxy_buffering off;
    }
}
