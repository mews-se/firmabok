# The complete self-hosted stack in one file: the app, its cron sidecar,
# official postgres and the two Supabase services still in use (GoTrue,
# PostgREST), all pinned. Driven by install-debian.sh; named
# docker-compose.yml so plain `docker compose stop/logs/ps` works from
# the checkout.
#
# nginx is the single entry point: one origin, plain HTTP (LAN-only by
# design), path routing that mirrors the hosted Supabase gateway layout
# (see docker/nginx.selfhost.conf). Kong, studio, realtime and the rest
# of the upstream stack are intentionally absent - the services
# themselves enforce JWT auth, which is what matters on a private
# network, and the app polls instead of subscribing.
#
# Needs a .env with DOMAIN, POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY,
# SERVICE_ROLE_KEY, CRON_SECRET and AUTH_SIGNUPS_DISABLED -
# install-debian.sh generates it.
services:
  proxy:
    image: nginx:stable-alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.selfhost.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The master runs as root and drops to the nginx user for workers,
    # hence the setuid/setgid/chown trio on top of the port bind.
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    mem_limit: 128m
    pids_limit: 50
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: ghcr.io/mews-se/firmabok:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      proxy:
        condition: service_started
    environment:
      # http by design: LAN-only stack, and the app's cookies follow the
      # URL scheme (lib/auth/cookie-secure.ts).
      NEXT_PUBLIC_SUPABASE_URL: http://${DOMAIN:?set DOMAIN in .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_APP_URL: http://${DOMAIN}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_BRANDING_APP_NAME: Firmabok
      NEXT_PUBLIC_SELF_HOSTED: "true"
      AUTH_SIGNUPS_DISABLED: ${AUTH_SIGNUPS_DISABLED}
      STORAGE_DIR: /var/lib/firmabok-storage
      NODE_OPTIONS: --max-old-space-size=384
    # The document archive lives on a named volume served directly by the
    # app (lib/storage/local.ts); no storage-api service.
    volumes:
      - storage_data:/var/lib/firmabok-storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    # Read-only root: Next.js still needs writable .next and public at
    # runtime, so they are sized tmpfs mounts owned by the app user.
    tmpfs:
      - /tmp
      - /app/.next:uid=1001,gid=1001,mode=750,size=400m
      - /app/public:uid=1001,gid=1001,mode=750,size=200m
    mem_limit: 1g
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  cron:
    build:
      context: docker
      dockerfile: cron.Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_URL=http://app:3000
    volumes:
      - ./docker/crontab.self-hosted:/etc/supercronic/crontab:ro
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    pids_limit: 30
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18.2-alpine
    volumes:
      # First-boot bootstrap: roles, the vendored GoTrue base schema
      # (Apache-2.0, see NOTICE) and API grants. The official image runs
      # these once while db_data is empty; everything else the stack needs
      # ships in postgres contrib (uuid-ossp, pgcrypto, btree_gist).
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql
    # Healthchecks across the stack: a tight start_interval keeps the
    # depends_on chain fast on boot, then the steady-state interval backs
    # off - four services probed every 5 s forever was constant idle CPU.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # ICU gives real Swedish collation (z, å, ä, ö) regardless of libc;
      # musl's own locale support is codepoint-only.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=sv-SE --locale=C.UTF-8
    # Sized for a single-tenant LAN install: a handful of connections,
    # no parallel query, no JIT. work_mem stays at 8MB because the SIE
    # import sorts real data.
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - track_activity_query_size=1024
      - -c
      - max_wal_size=512MB
      - -c
      - jit=off
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # One-shot: applies new files from supabase/migrations on every
  # `up -d`, tracked in the _firmabok.migrations table. The app waits
  # for it, so an update can never run against an unmigrated schema.
  migrate:
    image: postgres:18.2-alpine
    depends_on:
      db:
        condition: service_healthy
      # Healthy GoTrue means its own schema migrations have run; the app
      # migrations build on top of the auth schema.
      auth:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    logging: *logging

  auth:
    image: supabase/gotrue:v2.189.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 60s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://${DOMAIN}/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: http://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: http://${DOMAIN}/auth/callback,http://${DOMAIN}/api/auth/callback
      GOTRUE_DISABLE_SIGNUP: ${AUTH_SIGNUPS_DISABLED}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # The app pins user-token issuers to <public url>/auth/v1.
      GOTRUE_JWT_ISSUER: http://${DOMAIN}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # No mailer on the LAN: accounts are confirmed immediately.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Firmabok
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    restart: unless-stopped
    logging: *logging

  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_POOL: "5"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]
    restart: unless-stopped
    logging: *logging

# Named volumes: the database and document archive live under Docker's
# management instead of as container-uid-owned files in the checkout.
# Back up with pg_dump via docker exec, not by copying these.
volumes:
  db_data:
  storage_data:
