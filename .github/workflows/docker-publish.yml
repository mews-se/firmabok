name: Build and Push Docker Image

# Builds each platform on its own native runner, then stitches the two into one
# manifest list.
#
# This was a single amd64 job emulating arm64 through QEMU and took ~31 minutes:
# QEMU translates every Arm instruction into x86, so the arm64 half ran several
# times slower than the amd64 half it shared a runner with. GitHub's free
# `ubuntu-24.04-arm` runners (public repos) remove the emulation entirely, and
# the two halves now run concurrently on their own hardware.
#
# The cost is a second job. A native single-platform build cannot produce a
# multi-platform manifest by itself, so each build pushes an untagged,
# digest-addressed image and `merge` composes the tag list from those digests
# with `imagetools create`. Tagging, signing, and scanning all belong to `merge`,
# because the digest consumers actually resolve is the manifest list's, not
# either platform's.
#
# workflow_dispatch is deliberate: it makes this runnable from a branch before
# merge. On a non-default branch the is_default_branch guard below disables the
# `latest` tag, so a dispatch run publishes only the immutable commit-sha tag and
# cannot move what production pulls.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  schedule:
    # Monthly rebuild of main: same code, fresh base image and OS packages, so
    # published images pick up security fixes between releases. Only `latest`
    # and the commit-sha tag move; semver tags keep pointing at the builds
    # they were cut from, and no git tags or releases are created.
    - cron: '40 4 3 * *'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Derived from the repository so the personal twin publishes to its own
  # package without touching this file.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A hung step otherwise holds a runner until GitHub's six-hour default.
    # Both halves normally finish in under three minutes.
    timeout-minutes: 30
    strategy:
      # Publishing one architecture and silently dropping the other is worse
      # than publishing neither: the merge below needs both digests.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build pushes to GHCR via docker/login-action, never over git, so
          # the git credential is dead weight inside a Docker build context.
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags are applied once, to the manifest list, in `merge`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The user menu shows the package.json version, so a release tag must
      # match it or the image would claim the wrong version.
      - name: Check the tag against package.json
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME but package.json says $pkg"; exit 1; }

      # No setup-qemu-action. That was the whole point: each runner now builds
      # its own architecture natively.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTENSIONS_PRESET=self-hosted
            APP_COMMIT=${{ github.sha }}
          # SBOM (software bill of materials) + SLSA provenance are attached as
          # OCI attestations, queryable via `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          # Scheduled rebuilds exist to refresh OS packages inside otherwise
          # unchanged layers, which a cache hit would defeat: bypass the cache
          # on schedule so `apk upgrade` actually runs against today's Alpine.
          # The refreshed layers then repopulate the cache via cache-to below.
          no-cache: ${{ github.event_name == 'schedule' }}
          # push-by-digest publishes without a tag; `merge` collects the digests
          # and builds the tag list from them. name-canonical records the
          # repository name in the config so the merged manifest resolves.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache lives in GHCR, not the GitHub Actions cache. Two
          # platforms x mode=max is ~7 GB, which alone ate 70% of the repo's
          # 10 GB Actions cache quota and, because buildx refreshes every blob's
          # access time on each run, never aged out under LRU: it starved the
          # other workflows' caches instead. GHCR storage is free for public
          # repos and off that quota. mode=max is kept deliberately: mode=min
          # would drop the deps/builder stages and make every push redo
          # `npm ci` + `next build`.
          #
          # The cache tag is now per-architecture. Each runner builds a single
          # platform, so a shared tag would leave the two jobs racing to
          # overwrite a cache manifest describing layers the other cannot use.
          #
          # A stable cache tag is safe here: this workflow runs only on main,
          # on v*.*.* tags (cut from main), on the monthly schedule (main) and
          # on manual dispatch, so there is no untrusted ref that could poison
          # the layers.
          #
          # image-manifest=true,oci-mediatypes=true is required by GHCR, which
          # rejects buildkit's default cache manifest media type.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      # Digests reach `merge` as artifact filenames: the file content is
      # irrelevant, only the name carries information.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          # A silently empty artifact would surface later as an imagetools
          # invocation with no source digests, which is a much worse error.
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, sign and scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      # Docker Hub mirroring activates itself once the two secrets exist.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
      # OIDC token used by cosign keyless signing.
      id-token: write
      # SARIF upload to the repo's "Security" tab from the Trivy scan.
      security-events: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On main: push `latest` + commit-sha tags.
          # On v*.*.* tags: push semver tags (1.2.3, 1.2, 1) for production pinning.
          # A workflow_dispatch run from a branch gets the sha tag only, because
          # is_default_branch gates `latest`.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      # Cosign and Trivy must address the manifest list, not either platform's
      # image: the list digest is what `docker pull` resolves for consumers, so
      # it is the thing worth signing and the thing worth scanning.
      - name: Resolve manifest list digest
        id: manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Resolved ${REGISTRY}/${IMAGE_NAME}:${VERSION} -> ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify both platforms are present
        # A merge that quietly produced a single-arch manifest would ship a
        # broken image to every arm64 self-hoster, and nothing downstream checks
        # architecture. Assert it here while the digest is still in hand.
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          PLATFORMS=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --raw \
            | jq -r '[.manifests[]
                      | select(.platform != null)
                      | select(.platform.os != "unknown")
                      | "\(.platform.os)/\(.platform.architecture)"]
                     | sort | unique | join(",")')
          echo "Manifest platforms: ${PLATFORMS}"
          [ "$PLATFORMS" = "linux/amd64,linux/arm64" ] || {
            echo "::error::Expected linux/amd64,linux/arm64 but got ${PLATFORMS}"
            exit 1
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Scan image with Trivy (report-only)
        id: trivy
        # Decoupled from the publish gate on purpose: this pipeline must stay
        # green so builds are deterministic. The image is already pushed and
        # signed above, so failing here would only redden the run: it would not
        # unship a vulnerable image. exit-code:0 + continue-on-error keep CVEs
        # (and even a Trivy/DB outage) from failing the build; findings still
        # flow to the Security tab below. The real blocking gate is
        # docker-image-scan.yml, which re-scans the published image and fails
        # (notifying admins) on a fixable CRITICAL/HIGH CVE. It runs on a
        # workflow_run trigger the moment THIS workflow completes (so the gap
        # between publish and the blocking scan is the scan's own duration
        # (minutes), not a 24h cron window) plus a daily cron as a safety net.
        # Accepted residual risk: an image is live for that short scan window
        # before the gate fires.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        # if: always(), evidence must reach the Security tab regardless of the
        # scan step's exit status. With the previous `outcome == 'success'` guard,
        # a Trivy/DB outage that errored the scan would silently drop findings.
        # Kept non-fatal (continue-on-error) so a missing SARIF or a Security-tab
        # hiccup can't redden an otherwise-good publish.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Mirror to Docker Hub
        # Optional mirror for discoverability. skopeo copies the manifest list
        # digest-for-digest, so Docker Hub serves the exact builds published to
        # GHCR. The cosign signature stays on GHCR only: cosign stores
        # signatures next to the image, and mirroring them is not worth the
        # extra moving parts here.
        #
        # The repository guard is deliberate and belt-and-braces: the personal
        # twin receives this same file through the sync, and it must never be
        # able to mirror to Docker Hub, secrets or not.
        if: env.HAS_DOCKERHUB == 'true' && github.repository == 'mews-se/firmabok'
        # Every command below talks to a registry, so this step is where a
        # stalled connection can park the job. The v3.0.3 run sat here for 26
        # minutes until it was cancelled by hand; a normal mirror takes under a
        # minute.
        timeout-minutes: 15
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # skopeo ships in the hosted Ubuntu image. This step used to apt-get
          # install it regardless, and that is what wedged v3.0.3: apt hung on
          # an unresponsive azure.archive.ubuntu.com to install a package the
          # runner already had ("skopeo is already the newest version").
          command -v skopeo >/dev/null || {
            echo "::error::skopeo is missing from the runner image"
            exit 1
          }
          # Retry the transient registry failures (429, 5xx, timeouts) and give
          # every request a ceiling, so a stalled connection surfaces as an
          # error instead of a hang.
          curl_opts=(-fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120)
          # Trim whitespace/CR that easily sneaks in when secrets are pasted
          hub_user="$(printf %s "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          hub_pat="$(printf %s "$DOCKERHUB_TOKEN" | tr -d '[:space:]')"
          printf %s "$hub_pat" | skopeo login -u "$hub_user" --password-stdin docker.io
          hub_repo="${hub_user}/${IMAGE_NAME#*/}"
          hub_image="docker.io/${hub_repo}"
          # Bare commit-sha tags stay on GHCR only: on the mirror they are
          # noise nobody pulls by. After each copy the tag's index is
          # rewritten without the SBOM/provenance attestation manifests,
          # which Docker Hub renders as a bogus unknown/unknown platform.
          # The rewrite is a plain registry PUT: buildx imagetools create
          # would quietly re-attach the attestations via the referrers API.
          # GHCR keeps the fully attested index; the mirror shows
          # amd64+arm64 and nothing else.
          jq -r '.tags[] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON" \
            | { grep -Ev '^[0-9a-f]{7,40}$' || true; } \
            | while read -r tag; do
                skopeo copy --all --retry-times 3 \
                  "docker://${REGISTRY}/${IMAGE_NAME}:${tag}" \
                  "docker://${hub_image}:${tag}"
                # fresh push token per tag: the copies above can outlive the TTL
                hub_jwt=$(curl "${curl_opts[@]}" -u "${hub_user}:${hub_pat}" \
                  "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${hub_repo}:pull,push" \
                  | jq -r .token)
                idx=$(curl "${curl_opts[@]}" -H "Authorization: Bearer ${hub_jwt}" \
                  -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                  "https://registry-1.docker.io/v2/${hub_repo}/manifests/${tag}")
                clean=$(jq -c '.manifests |= map(select(.platform != null and .platform.os != "unknown"))' <<< "$idx")
                mt=$(jq -r '.mediaType // "application/vnd.oci.image.index.v1+json"' <<< "$idx")
                curl "${curl_opts[@]}" -X PUT -H "Authorization: Bearer ${hub_jwt}" \
                  -H "Content-Type: ${mt}" --data-binary "$clean" \
                  "https://registry-1.docker.io/v2/${hub_repo}/manifests/${tag}" > /dev/null
              done
